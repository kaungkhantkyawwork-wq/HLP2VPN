name: HLP2VPN ARM64 test APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arm64-test.yml'
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'Makefile'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hlp2vpn-arm64-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk
      - name: Prepare HLP2VPN branding
        run: |
          set -euo pipefail
          ICON=assets/images/source/hlp2vpn_app_icon.png
          test -s "$ICON"
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp "$ICON" android/app/src/main/res/drawable-nodpi/hlp2vpn_app_icon.png
          cp "$ICON" android/app/src/main/ic_launcher-playstore.png
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="\${spec%%:*}"
            size="\${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-\${density}"
            convert "$ICON" -resize "\${size}x\${size}" "android/app/src/main/res/mipmap-\${density}/ic_launcher.png"
            convert "$ICON" -resize "\${size}x\${size}" "android/app/src/main/res/mipmap-\${density}/ic_launcher_round.png"
          done
      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=commit=${GITHUB_SHA}
      - name: Collect exactly one APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/HLP2VPN-ARM64.apk
          test "$(find out -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v6
        with:
          name: HLP2VPN-ARM64-APK
          path: out/HLP2VPN-ARM64.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
